openapi: 3.0.0
info:
  title: HyperFleet Desire Store API
  version: 0.2.1
  contact:
    name: HyperFleet Team
    url: https://github.com/openshift-hyperfleet
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |-
    HyperFleet Desire Store API transports desires (apply, delete, read) from
    Adapters to Appliers. A caller sends a bearer token for its service account
    to the gateway. The gateway validates it and passes the caller's identity
    and authorized partition to the API. The API never takes them from request
    fields.

    | Operation | Callers |
    |-----------|---------|
    | List desires, Get desire | Adapter, remote Applier, sweeper |
    | Write desire | Adapter; sweeper for DeleteDesire only |
    | Write status | Remote Applier |
    | Delete desire | Adapter, sweeper |

    Other calls return 403. Errors are RFC 9457 problem details with a
    `HYPERFLEET-CAT-NUM` code. Do not retry 400, 401, 403, or 422 unchanged.
    For a 409, follow the client action in `ConflictProblem`. Retry 503,
    timeouts, and network failures with capped exponential backoff and jitter,
    and wait for `Retry-After` on 429.

    **v1 compatibility.**

    - Supported v1 Appliers must continue working when the API is deployed
    independently.
    - Operation behavior and authorization rules remain stable in v1.
    - Optional additive request and response fields are compatible within v1.
    - Changes to required fields, operation behavior, authorization,
    compare-and-swap, or idempotency require a new API version.
tags:
  - name: Desires
paths:
  /api/hyperfleet/desire-store/v1/partitions/{partition}/desires:
    get:
      operationId: listDesires
      summary: List desires
      description: |-
        Lists the references of the desires in a partition, one page at a time.
        Get serves the full record of each desire.

        Pages use an opaque keyset cursor and carry no total count. A multi-page
        read is not a consistent snapshot: a desire that changes during the read
        can show up only on the next list. A client must not treat an incomplete
        or failed list as an empty partition.
      parameters:
        - $ref: '#/components/parameters/PartitionPath'
        - name: type
          in: query
          required: false
          description: Return only desires of this type. Omitted returns all types.
          schema:
            $ref: '#/components/schemas/DesireType'
          explode: false
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page. Omitted returns the first page.
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          description: |-
            The maximum number of references on the page. A value above the maximum
            returns 400 and is not clamped.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
          explode: false
      responses:
        '200':
          description: The desire list page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesireList'
        '400':
          description: 'Malformed request: invalid identifier encoding, query parameters, or JSON; missing or non-integer `version` on a delete, or on an ApplyDesire or DeleteDesire status write; `owner` in a write body; `target_version` missing on a ReadDesire write; `kubeContent` missing on an ApplyDesire write; `kubeContent` on a ReadDesire or DeleteDesire write; a non-zero `version` on a ReadDesire or DeleteDesire write.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          description: The credential is missing, invalid, or expired. A 401 from the API has this body. A 401 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: The caller class is not permitted for the operation, or the path partition is outside the caller's authorization. A 403 from the API has this body. A 403 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '429':
          description: Rate limited. Honor the `Retry-After` header before retrying.
          headers:
            Retry-After:
              required: true
              description: 'Delay before the client retries: delay-seconds or an HTTP date (RFC 9110).'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
        '500':
          description: Internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalErrorProblem'
        '503':
          description: The API is degraded. Retry with capped exponential backoff and jitter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Desires
      security:
        - BearerAuth: []
  /api/hyperfleet/desire-store/v1/partitions/{partition}/desires/{desire-id}:
    get:
      operationId: getDesire
      summary: Get desire
      description: Gets one desire with its full record.
      parameters:
        - $ref: '#/components/parameters/PartitionPath'
        - $ref: '#/components/parameters/DesireIdPath'
      responses:
        '200':
          description: The desire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desire'
              examples:
                ReadDesire:
                  summary: ReadDesire
                  value:
                    id: read:apps:deployments:kube-system:coredns
                    type: read
                    group: apps
                    resource: deployments
                    namespace: kube-system
                    name: coredns
                    owner: system:serviceaccount:hyperfleet:cluster-adapter-hyperfleet-adapter
                    resource_id: clusters/cls-123
                    target_version: v1
                    status:
                      kubeContent:
                        apiVersion: apps/v1
                        kind: Deployment
                        metadata:
                          name: coredns
                          namespace: kube-system
                    generation: 1
                    version: 1
                ApplyDesire:
                  summary: ApplyDesire
                  value:
                    id: apply:apps:deployments:kube-system:coredns
                    type: apply
                    group: apps
                    resource: deployments
                    namespace: kube-system
                    name: coredns
                    owner: system:serviceaccount:hyperfleet:cluster-adapter-hyperfleet-adapter
                    resource_id: clusters/cls-123
                    kubeContent:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: coredns
                        namespace: kube-system
                    generation: 2
                    version: 3
        '400':
          description: 'Malformed request: invalid identifier encoding, query parameters, or JSON; missing or non-integer `version` on a delete, or on an ApplyDesire or DeleteDesire status write; `owner` in a write body; `target_version` missing on a ReadDesire write; `kubeContent` missing on an ApplyDesire write; `kubeContent` on a ReadDesire or DeleteDesire write; a non-zero `version` on a ReadDesire or DeleteDesire write.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          description: The credential is missing, invalid, or expired. A 401 from the API has this body. A 401 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: The caller class is not permitted for the operation, or the path partition is outside the caller's authorization. A 403 from the API has this body. A 403 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '404':
          description: The desire is absent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '429':
          description: Rate limited. Honor the `Retry-After` header before retrying.
          headers:
            Retry-After:
              required: true
              description: 'Delay before the client retries: delay-seconds or an HTTP date (RFC 9110).'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
        '500':
          description: Internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalErrorProblem'
        '503':
          description: The API is degraded. Retry with capped exponential backoff and jitter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Desires
      security:
        - BearerAuth: []
    put:
      operationId: writeDesire
      summary: Write desire
      description: |-
        Creates or updates a desire. The path is the only source of its identity.

        **Create and update.** A create returns 201, or 409 `HYPERFLEET-CNF-001`
        when the caller already has the desire. An ApplyDesire update succeeds
        only at the stored version: it increases the version and returns 200. A
        stale version returns 409 `HYPERFLEET-CNF-002`, and an update of an absent
        ApplyDesire returns 404. ReadDesire and DeleteDesire have no update. See
        `DesireWrite.version`.

        **Owner.** All desires for one Kubernetes object in one partition have the
        same `owner`: the caller that created the first of them. While one of them
        exists, a create, write, or delete by a different caller returns 409
        `HYPERFLEET-CNF-004`. Only the sweeper is exempt from this check, but the
        exemption does not take effect until HYPERFLEET-1937 changes the shared
        store interface. Until then, the sweeper also gets `HYPERFLEET-CNF-004` on
        an object that a different caller owns. A DeleteDesire that the sweeper
        creates is owned by the sweeper. It is the
        one exception to the single `owner`, until the Applier confirms the
        deletion and the sweeper removes it.

        **Delete supersedes apply.** Creating a DeleteDesire atomically removes
        the ApplyDesire for the same object at any version and returns 201. An
        in-flight update or status write to that ApplyDesire then returns 404. The
        ReadDesire for the object does not change. A second DeleteDesire create
        returns 409 `HYPERFLEET-CNF-001`. An ApplyDesire create returns 409
        `HYPERFLEET-CNF-003` until the Applier confirms the delete, and then
        replaces the DeleteDesire.

        **Timed-out writes.** The client reads the desire. When it already shows
        the change, the write succeeded. Otherwise the client re-evaluates and
        retries.
      parameters:
        - $ref: '#/components/parameters/PartitionPath'
        - $ref: '#/components/parameters/DesireIdPath'
      responses:
        '200':
          description: The desire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desire'
        '201':
          description: The desire was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desire'
        '400':
          description: 'Malformed request: invalid identifier encoding, query parameters, or JSON; missing or non-integer `version` on a delete, or on an ApplyDesire or DeleteDesire status write; `owner` in a write body; `target_version` missing on a ReadDesire write; `kubeContent` missing on an ApplyDesire write; `kubeContent` on a ReadDesire or DeleteDesire write; a non-zero `version` on a ReadDesire or DeleteDesire write.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          description: The credential is missing, invalid, or expired. A 401 from the API has this body. A 401 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: The caller class is not permitted for the operation, or the path partition is outside the caller's authorization. A 403 from the API has this body. A 403 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '404':
          description: The desire is absent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: One of four conflicts. The `code` field tells which one; see `ConflictProblem`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          description: Well-formed JSON that fails semantic validation, such as `kubeContent` whose Kubernetes identity does not match the path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableProblem'
        '429':
          description: Rate limited. Honor the `Retry-After` header before retrying.
          headers:
            Retry-After:
              required: true
              description: 'Delay before the client retries: delay-seconds or an HTTP date (RFC 9110).'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
        '500':
          description: Internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalErrorProblem'
        '503':
          description: The API is degraded. Retry with capped exponential backoff and jitter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Desires
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesireWrite'
      security:
        - BearerAuth: []
    delete:
      operationId: deleteDesire
      summary: Delete desire
      description: |-
        Deletes a desire at its current version and returns 204. A stale version
        returns 409 `HYPERFLEET-CNF-002`, a desire that a different caller owns
        returns 409 `HYPERFLEET-CNF-004`, and an absent desire returns 404. Only
        the sweeper is exempt from the owner check, and only after HYPERFLEET-1937
        (see the Write desire description). To remove an applied object,
        the Adapter creates a DeleteDesire instead.

        **Timed-out delete recovery.** The client reads the desire:

        - Absent: the delete succeeded.
        - Present at the same version: the client retries the delete.
        - Present at a different version: the desire changed or was created
        again. The client does not retry and re-evaluates instead.

        An Adapter can also retry the delete directly. A 404 then means success.

        Versions restart at 1 when a desire is created again, so a retried delete
        can remove a new record at the same version. The sweeper retries only
        when the stored `owner` is still its own identity.
      parameters:
        - $ref: '#/components/parameters/PartitionPath'
        - $ref: '#/components/parameters/DesireIdPath'
        - name: version
          in: query
          required: true
          description: The current version of the desire.
          schema:
            type: integer
            format: int64
            minimum: 1
          explode: false
      responses:
        '204':
          description: Success, with no body.
        '400':
          description: 'Malformed request: invalid identifier encoding, query parameters, or JSON; missing or non-integer `version` on a delete, or on an ApplyDesire or DeleteDesire status write; `owner` in a write body; `target_version` missing on a ReadDesire write; `kubeContent` missing on an ApplyDesire write; `kubeContent` on a ReadDesire or DeleteDesire write; a non-zero `version` on a ReadDesire or DeleteDesire write.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          description: The credential is missing, invalid, or expired. A 401 from the API has this body. A 401 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: The caller class is not permitted for the operation, or the path partition is outside the caller's authorization. A 403 from the API has this body. A 403 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '404':
          description: The desire is absent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: One of four conflicts. The `code` field tells which one; see `ConflictProblem`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '429':
          description: Rate limited. Honor the `Retry-After` header before retrying.
          headers:
            Retry-After:
              required: true
              description: 'Delay before the client retries: delay-seconds or an HTTP date (RFC 9110).'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
        '500':
          description: Internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalErrorProblem'
        '503':
          description: The API is degraded. Retry with capped exponential backoff and jitter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Desires
      security:
        - BearerAuth: []
  /api/hyperfleet/desire-store/v1/partitions/{partition}/desires/{desire-id}/status:
    put:
      operationId: writeDesireStatus
      summary: Write status
      description: |-
        Writes the status of a desire and returns 204. It does not check the
        `owner`, because the Applier writes status on desires that adapters own.

        **ApplyDesire and DeleteDesire.** The write succeeds only at the stored
        version, and it increments the version. A stale version returns 409
        `HYPERFLEET-CNF-002`. A spec update and a status write share the version,
        so a status computed for an older spec returns `HYPERFLEET-CNF-002`, and
        so does an Adapter update that loses a race with a status write.
        A retry of a status write that already succeeded also returns
        `HYPERFLEET-CNF-002`. Versions restart at 1 when a desire is created
        again, so a stale status write can match the new record.

        **ReadDesire.** The write has no version check and does not change the
        version. A late write can overwrite a newer status.

        A status write to an ApplyDesire that a DeleteDesire superseded returns
        404.
      parameters:
        - $ref: '#/components/parameters/PartitionPath'
        - $ref: '#/components/parameters/DesireIdPath'
      responses:
        '204':
          description: Success, with no body.
        '400':
          description: 'Malformed request: invalid identifier encoding, query parameters, or JSON; missing or non-integer `version` on a delete, or on an ApplyDesire or DeleteDesire status write; `owner` in a write body; `target_version` missing on a ReadDesire write; `kubeContent` missing on an ApplyDesire write; `kubeContent` on a ReadDesire or DeleteDesire write; a non-zero `version` on a ReadDesire or DeleteDesire write.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '401':
          description: The credential is missing, invalid, or expired. A 401 from the API has this body. A 401 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedProblem'
        '403':
          description: The caller class is not permitted for the operation, or the path partition is outside the caller's authorization. A 403 from the API has this body. A 403 from the gateway has no body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblem'
        '404':
          description: The desire is absent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
        '409':
          description: One of four conflicts. The `code` field tells which one; see `ConflictProblem`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '429':
          description: Rate limited. Honor the `Retry-After` header before retrying.
          headers:
            Retry-After:
              required: true
              description: 'Delay before the client retries: delay-seconds or an HTTP date (RFC 9110).'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
        '500':
          description: Internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalErrorProblem'
        '503':
          description: The API is degraded. Retry with capped exponential backoff and jitter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableProblem'
        default:
          description: An unexpected error response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Desires
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusWrite'
      security:
        - BearerAuth: []
components:
  parameters:
    DesireIdPath:
      name: desire-id
      in: path
      required: true
      description: The desire identifier. See `DesireId` for the encoding.
      schema:
        $ref: '#/components/schemas/DesireId'
    PartitionPath:
      name: partition
      in: path
      required: true
      description: |-
        The partition that the request targets, which is the `managementCluster`
        of the desire identity. A partition needs no setup: the first write to it
        creates it.

        - A remote Applier's path partition must equal the partition in its
        binding. A mismatch returns 403.
        - The Adapter and the sweeper may target any partition per request.
      schema:
        type: string
  schemas:
    BadRequestProblem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type, in the form `https://api.hyperfleet.io/errors/{problem-type}`.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: 'URI reference for this occurrence: the request path.'
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 timestamp of when the error occurred.
        trace_id:
          type: string
          description: Distributed trace ID for correlating the response with server logs.
        code:
          type: string
          description: Machine-readable error code in `HYPERFLEET-CAT-NUM` format.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Field-level validation errors, present on validation failures.
      description: Problem body for a 400 response.
      example:
        type: https://api.hyperfleet.io/errors/validation-error
        title: Validation Error
        status: 400
        detail: version is required
        instance: /api/hyperfleet/desire-store/v1/partitions/mc-01/desires/apply:apps:deployments:kube-system:coredns
        code: HYPERFLEET-VAL-001
        timestamp: '2026-10-19T10:30:00.123Z'
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          - field: version
            constraint: required
            message: version is required
    ConflictProblem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type, in the form `https://api.hyperfleet.io/errors/{problem-type}`.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code of the response.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: 'URI reference for this occurrence: the request path.'
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 timestamp of when the error occurred.
        trace_id:
          type: string
          description: Distributed trace ID for correlating the response with server logs.
        code:
          type: string
          description: |-
            Machine-readable error code in `HYPERFLEET-CAT-NUM` format. The
            `ConflictProblem` description lists the codes for a 409.
        expected_version:
          type: integer
          format: int64
          description: The version the request carried. Present on `HYPERFLEET-CNF-002`.
        actual_version:
          type: integer
          format: int64
          description: The version stored for the desire. Present on `HYPERFLEET-CNF-002`.
      description: |-
        RFC 9457 problem details for a 409 response. Each cause has its own `code`,
        so a client tells a recoverable conflict from an ownership error without
        parsing `detail`.

        | Cause | Type | Code | Client action |
        |-------|------|------|---------------|
        | The version in a write, a status write, or a delete is not current | `version-conflict` | `HYPERFLEET-CNF-002` | Read the desire again. If the change is still necessary, retry with the current version |
        | The caller creates a desire that it already has | `resource-conflict` | `HYPERFLEET-CNF-001` | Depends on the type. ApplyDesire: read the desire, then update it with its version. DeleteDesire: the existing record already requests the delete, so treat the create as done. ReadDesire: read the desire. If its `target_version` differs, delete it with its version and create it again |
        | The caller creates an ApplyDesire while the DeleteDesire for the object is not confirmed | `resource-conflict` | `HYPERFLEET-CNF-003` | Retry after the Applier confirms the delete. The store then replaces the DeleteDesire with the new ApplyDesire |
        | A different caller owns the object | `resource-conflict` | `HYPERFLEET-CNF-004` | Do not retry. No request from this caller changes the `owner` |

        On a write or a delete, the store checks the version before the `owner`.
        When both are wrong, the response is `HYPERFLEET-CNF-002`. The retry with
        the current version then gets `HYPERFLEET-CNF-004`. Status writes do not
        check the `owner`, so `HYPERFLEET-CNF-002` is the only conflict code that a
        status write can get.
